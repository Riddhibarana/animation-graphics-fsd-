<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        /*
        transform:
        (1)translateX(200px)
        (2)translateY(100px)
        (3)translate(100,200)

        scale:
        scaleX +ve:grow
        scaleY  strink:0-1
        scale   -ve:flip+grow

        skewx }
        skewy } deg
        skew  }
        
        rotate
        rotatex
        rotatey
        rotatez

        suggested order for givening multiple =translate scale rotate skew
        transition-duration:ms/s
        transition-timing-function:ease,ease-in,ease-out,linear,ease-in-out
        trasion:property,duration,timing-function,delay
        */
       div
       {
        height: 200px;
        width: 200px;
        background-color: purple;
        color: white;
        border: 2px solid olive;
        text-align: center;
        line-height: 200px;
        margin: 30px;
       }
       #b1:hover
       {
        transform:translate(200px,100px)
       }
       #b2:hover
       {
        transform: scale(-1);
       }
       #b3:hover
       {
        transform: rotateX(45deg);
       }
       #b4:hover
       {
        transform:skew(1400deg);
       }
          #b5:hover
       {
         transform:translateX(300px) scale(2) rotate(70deg) skewX(30deg); 
          /* transform:skew(30deg) rotate(70deg) scale(2) translateX(300px) */
          /* transition-duration: 6s;
          -> aama trasnion-duration na aaply krvu nahiter cursor mukta jatko mrine pacho aavse
            */
            background-color:maroon;
        font-size:50px;
        text-decoration: underline;
       
       }
       #b5
       {
        transition: transform 10s linear ,background-color 5s ease-in,font-size 3s ease-out 1s,text-decoration 7s ease ;
     
         /* transition-property: transform,text-decoration,background-color,font-size;
            transition-duration: 5s,10s,4s,2s;
            /* transition-delay: 2s; */
            /* transition-timing-function:linear; */ 
        
       }
       #b1
       {
            transition-duration: 5s;
            transition-timing-function:ease;
        
       }
       #b2
       {
         transition-duration: 5s;
            transition-timing-function:ease-in;

           }
       #b3
       {
         transition-duration: 5s;
            transition-timing-function:ease-out;
       }    
       #b4
       {
         transition-duration: 5s;
            transition-timing-function:ease-in-out;
       }
    </style>
</head>
<body>
    <div id="b1">box-1</div>
    <div id="b2">box-2</div>
    <div id="b3">box-3</div>
    <div id="b4">box-4</div>
    <div id="b5">box-5</div>
    
</body>
</html>
