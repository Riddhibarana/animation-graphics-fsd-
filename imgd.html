<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgd</title>
    <style>
        #i1
        {
            height: 200px;
            width: 200px;
            border-radius: 50%;
            opacity: 0.5;
        }
        #i2
        {
            height: 200px;
            width: 200px;
            padding: 25px;
            border: 4px solid grey;
            border-radius: 15%;
             transition: all 2s;
           
        }
        #i2:hover
        {
           box-shadow:5px 5px 5px green;
          
        }
        #i4
        {
            max-width: 100%;
            height: auto;
            
        }
        /* text on image */
        #i3
        {
            
            height: 400px;
            width:600px;
            opacity: 0.5;
        }
        #p
        {
            height: 400px;
            width: 600px;
            position: relative;
        }
        #t1
        {
            position:absolute;
            top:0px;
            left:0px;
            color:yellow;
        }
        #t2
        {
            
            position:absolute;
            bottom:0px;
            right:0px;
            color: hotpink;
        }
        #t3
        {
            position:absolute;
            bottom:170px;
            right:300px;
            color: white;

        }

    </style>
</head>
<body>
    <img id="i1" src="images (1).jfif">
    <br>
    <img id="i2" src="images (2).jfif">
    <br>
    <div id="p">
    <img id="i3" src="images (3).jfif">
    <h1 id="t1">LJKU</h1>
    <h1 id="t2">Ljiet</h1>
    <h1 id="t3">Hello</h1>
    </div>
    <br>
    <img id="i4" src="images.jfif">
</body>
</html>
